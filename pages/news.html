<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaming News — PolyLog</title>
  <meta name="description" content="Stay up to date with the latest gaming news, reviews, and updates from IGN, GameSpot, and more.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://9onewave.github.io/polylog/pages/news.html">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .news-full-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px; }
    .news-full-card {
      background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);
      overflow:hidden;cursor:pointer;transition:all var(--transition);display:flex;flex-direction:column;
    }
    .news-full-card:hover { border-color:var(--border-2);transform:translateY(-4px);box-shadow:var(--shadow); }
    .news-full-img { width:100%;aspect-ratio:16/9;object-fit:cover;filter:brightness(.8); }
    .news-full-body { padding:18px;flex:1;display:flex;flex-direction:column;gap:8px; }
    .news-full-title { font-family:var(--font-display);font-size:1rem;font-weight:700;line-height:1.35;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden; }
    .news-full-desc  { font-size:13px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
    .source-badge { display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px; }
    .source-ign      { background:rgba(255,69,0,.15);  color:#FF4500; }
    .source-gamespot { background:rgba(0,229,255,.1);   color:var(--accent); }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-04H1D0WZHN"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-04H1D0WZHN');</script>
  </script>
  <!-- Google Analytics — kept from modified version -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-04H1D0WZHN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-04H1D0WZHN');
  </script>

</head>
<body>
<script src="../js/components.js"></script>

<main style="padding-top:var(--nav-h)">
  <div class="page-hero">
    <div class="container">
      <div class="section-label">📰 Gaming News</div>
      <h1 class="page-hero-title">Latest News</h1>
      <p class="page-hero-desc">Gaming news, reviews, and updates from IGN and GameSpot — aggregated and sorted by recency.</p>
    </div>
  </div>

  <div class="container">
    <div class="filter-bar fade-up">
      <span class="filter-label">Source</span>
      <div class="filter-chips" id="source-filter">
        <button class="filter-chip active" data-source="">All Sources</button>
        <button class="filter-chip" data-source="IGN">IGN</button>
        <button class="filter-chip" data-source="GameSpot">GameSpot</button>
      </div>
    </div>

    <div id="featured-wrap" class="fade-up" style="margin-bottom:32px"></div>

    <div class="section-header">
      <div>
        <div class="section-label">Latest Articles</div>
        <h2 class="section-title">All Stories</h2>
      </div>
    </div>
    <div class="news-full-grid" id="news-grid"></div>
  </div>
</main>

<script src="../js/main.js"></script>
<script>
(async function() {
  const P = window.POLYLOG;
  let allArticles = [], activeSource = '';

  async function loadNews() {
    const grid = document.getElementById('news-grid');
    grid.innerHTML = Array(6).fill(0).map(()=>
      `<div class="skeleton" style="height:280px;border-radius:var(--radius-lg)"></div>`).join('');
    allArticles = await P.News.all();
    applyFilter();
  }

  function applyFilter() {
    const filtered = activeSource ? allArticles.filter(a => a.source === activeSource) : allArticles;
    renderFeatured(filtered);
    renderGrid(filtered);
  }

  function renderFeatured(filtered) {
    const el = document.getElementById('featured-wrap');
    if (!filtered.length) { el.innerHTML = ''; return; }
    const a   = filtered[0];
    const tag = P.getNewsTag(a);
    const img = a.thumbnail || a.enclosure?.link || P.PLACEHOLDER_WIDE;
    const srcClass = a.source === 'IGN' ? 'source-ign' : 'source-gamespot';
    el.innerHTML = `
      <div class="news-card-featured" style="border-radius:var(--radius-xl);cursor:pointer">
        <img src="${img}" alt="${P.escapeHTML(a.title)}"
             style="width:100%;max-height:380px;object-fit:cover;filter:brightness(.55) saturate(.8)"
             loading="eager" onerror="this.src='${P.PLACEHOLDER_WIDE}'">
        <div class="news-card-featured-body">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
            <span class="news-tag ${tag.cls}">${tag.label}</span>
            <span class="source-badge ${srcClass}">${P.escapeHTML(a.source)}</span>
          </div>
          <h2 class="news-card-featured-title" style="font-size:1.6rem">${P.escapeHTML(a.title)}</h2>
          <p style="font-size:14px;color:var(--text-2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">
            ${P.escapeHTML((a.description||'').replace(/<[^>]+>/g,'').slice(0,200))}…
          </p>
          <div class="news-meta" style="margin-top:14px">
            <span>${P.escapeHTML(a.source)}</span><span>·</span><span>${P.timeAgo(a.pubDate)}</span>
            <span style="margin-left:auto" class="btn btn-secondary btn-sm">Read Article →</span>
          </div>
        </div>
      </div>`;
    el.querySelector('.news-card-featured').addEventListener('click', () =>
      window.open(a.link, '_blank', 'noopener'));
  }

  function renderGrid(filtered) {
    const grid    = document.getElementById('news-grid');
    const articles = filtered.slice(1, 25);
    if (!articles.length) {
      grid.innerHTML = '<p style="color:var(--text-3);grid-column:1/-1;text-align:center;padding:48px">No articles found.</p>';
      return;
    }
    grid.innerHTML = articles.map(a => {
      const tag      = P.getNewsTag(a);
      const img      = a.thumbnail || a.enclosure?.link || P.PLACEHOLDER_WIDE;
      const srcClass = a.source === 'IGN' ? 'source-ign' : 'source-gamespot';
      const link     = a.link; // stored for event listener below
      return `
        <div class="news-full-card fade-up" data-link="${P.escapeHTML(a.link)}">
          <img class="news-full-img" src="${img}" alt="${P.escapeHTML(a.title)}" loading="lazy" onerror="this.src='${P.PLACEHOLDER_WIDE}'">
          <div class="news-full-body">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="news-tag ${tag.cls}" style="margin:0">${tag.label}</span>
              <span class="source-badge ${srcClass}" style="font-size:10px">${P.escapeHTML(a.source)}</span>
            </div>
            <div class="news-full-title">${P.escapeHTML(a.title)}</div>
            <div class="news-full-desc">${P.escapeHTML((a.description||'').replace(/<[^>]+>/g,'').slice(0,120))}</div>
            <div class="news-meta" style="margin-top:8px"><span>${P.timeAgo(a.pubDate)}</span></div>
          </div>
        </div>`;
    }).join('');

    // FIX: use event delegation instead of inline onclick with raw URLs
    grid.addEventListener('click', e => {
      const card = e.target.closest('.news-full-card');
      if (card?.dataset.link) window.open(card.dataset.link, '_blank', 'noopener');
    });
    P.initFadeUp(grid);
  }

  document.getElementById('source-filter')?.addEventListener('click', e => {
    const chip = e.target.closest('.filter-chip'); if (!chip) return;
    document.querySelectorAll('#source-filter .filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeSource = chip.dataset.source;
    applyFilter();
  });

  loadNews();
})();
</script>
</body>
</html>
