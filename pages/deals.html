<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Deals — PolyLog</title>
  <meta name="description" content="Find the best PC game deals and discounts. Powered by CheapShark — compare prices across Steam, Epic, GOG and more.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .deals-table { width:100%;border-collapse:collapse; }
    .deals-table th { text-align:left;padding:12px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);border-bottom:1px solid var(--border);background:var(--bg-2); }
    .deals-table td { padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle; }
    .deals-table tr:last-child td { border-bottom:none; }
    .deals-table tr:hover td { background:var(--surface); }
    .deals-table-wrap { background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden; }
    .deal-thumb { width:56px;height:36px;object-fit:cover;border-radius:4px;vertical-align:middle; }
    .view-toggle { display:flex;background:var(--bg-2);border:1px solid var(--border);border-radius:999px;padding:3px; }
    .view-btn { height:30px;padding:0 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition);color:var(--text-3); }
    .view-btn.active { background:var(--surface-2);color:var(--text); }
    .store-badge { display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:4px;background:var(--surface);border:1px solid var(--border); }
  </style>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-04H1D0WZHN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-04H1D0WZHN');
</script>
</head>
<body>
<script src="../js/components.js"></script>

<main style="padding-top:var(--nav-h)">
  <div class="page-hero">
    <div class="container">
      <div class="section-label">💰 Best Deals</div>
      <h1 class="page-hero-title">Game Deals</h1>
      <p class="page-hero-desc">The best PC game discounts right now. Powered by CheapShark — comparing prices across Steam, Epic, GOG, and more.</p>
    </div>
  </div>

  <div class="container">
    <!-- Controls -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px" class="fade-up">
      <div class="filter-bar" style="margin:0;flex:1">
        <span class="filter-label">Sort By</span>
        <select class="filter-select" id="sort-filter">
          <option value="DealRating">Deal Rating</option>
          <option value="Savings">Savings %</option>
          <option value="Price">Lowest Price</option>
          <option value="Name">Name</option>
          <option value="Recent">Most Recent</option>
        </select>
        <span class="filter-label">Min Savings</span>
        <select class="filter-select" id="savings-filter">
          <option value="0">Any</option>
          <option value="25">25%+</option>
          <option value="50">50%+</option>
          <option value="75">75%+</option>
          <option value="90">90%+</option>
        </select>
        <span class="filter-label">Max Price</span>
        <select class="filter-select" id="price-filter">
          <option value="">Any</option>
          <option value="5">Under $5</option>
          <option value="10">Under $10</option>
          <option value="20">Under $20</option>
          <option value="30">Under $30</option>
        </select>
      </div>
      <div class="view-toggle">
        <button class="view-btn active" id="view-grid-btn">⊞ Grid</button>
        <button class="view-btn" id="view-list-btn">≡ List</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar fade-up" style="margin-bottom:32px">
      <div class="stat-item"><div class="stat-num" id="stat-deals">—</div><div class="stat-label">Deals Found</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-avg-savings">—</div><div class="stat-label">Avg. Savings</div></div>
      <div class="stat-item"><div class="stat-num" id="stat-best">—</div><div class="stat-label">Best Discount</div></div>
    </div>

    <!-- Grid view -->
    <div class="deals-grid" id="deals-grid"></div>

    <!-- Table view -->
    <div class="deals-table-wrap" id="deals-table-wrap" style="display:none">
      <table class="deals-table">
        <thead>
          <tr>
            <th>Game</th>
            <th>Store</th>
            <th>Was</th>
            <th>Now</th>
            <th>Savings</th>
            <th>Rating</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="deals-table-body"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</main>

<script src="../js/main.js"></script>
<script>
(async function() {
  const P = window.POLYLOG;
  let isGrid = true, currentPage = 0, allDeals = [];
  const STORE_NAMES = {};

  // Load stores
  async function loadStores() {
    const stores = await P.CheapShark.stores();
    if (stores) stores.forEach(s => { STORE_NAMES[s.storeID] = s.storeName; });
  }

  async function loadDeals() {
    const grid = document.getElementById('deals-grid');
    const tbody = document.getElementById('deals-table-body');
    if (isGrid) P.skeletonCards(12, grid);
    else { grid.innerHTML=''; if(tbody) tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-3)">Loading…</td></tr>'; }

    const sortBy = document.getElementById('sort-filter').value;
    const minSavings = document.getElementById('savings-filter').value;
    const maxPrice = document.getElementById('price-filter').value;
    const params = { pageSize: 30, pageNumber: currentPage, sortBy };
    if (minSavings) params.lowerPrice = 0, params.upperPrice = maxPrice || 999, params.minimumSavings = minSavings;
    if (maxPrice) params.upperPrice = maxPrice;

    const deals = await P.CheapShark.deals(params);
    allDeals = deals || [];

    // Stats
    const statDeals = document.getElementById('stat-deals');
    const statAvg = document.getElementById('stat-avg-savings');
    const statBest = document.getElementById('stat-best');
    if (statDeals) statDeals.textContent = allDeals.length;
    if (allDeals.length) {
      const avg = allDeals.reduce((a,d)=>a+parseFloat(d.savings),0)/allDeals.length;
      const best = Math.max(...allDeals.map(d=>parseFloat(d.savings)));
      if (statAvg) statAvg.textContent = Math.round(avg)+'%';
      if (statBest) statBest.textContent = Math.round(best)+'%';
    }

    renderDeals();
  }

  function renderDeals() {
    const grid = document.getElementById('deals-grid');
    const tbody = document.getElementById('deals-table-body');

    if (isGrid) {
      grid.style.display = 'grid';
      document.getElementById('deals-table-wrap').style.display = 'none';
      if (!allDeals.length) { grid.innerHTML='<p style="color:var(--text-3);grid-column:1/-1;text-align:center;padding:48px">No deals found.</p>'; return; }
      grid.innerHTML = allDeals.map(d => `
        <a class="deal-card fade-up" href="https://www.cheapshark.com/redirect?dealID=${d.dealID}" target="_blank" rel="noopener noreferrer">
          <div class="deal-card-img-wrap">
            <img class="deal-card-img" src="${d.thumb||P.PLACEHOLDER_WIDE}" alt="${d.title}" loading="lazy" onerror="this.src='${P.PLACEHOLDER_WIDE}'">
          </div>
          <div class="deal-card-body">
            <div class="deal-card-title">${d.title}</div>
            <div class="deal-card-prices">
              <span class="deal-price-now">$${parseFloat(d.salePrice).toFixed(2)}</span>
              <span class="deal-price-was">$${parseFloat(d.normalPrice).toFixed(2)}</span>
              <span class="deal-badge">-${Math.round(d.savings)}%</span>
            </div>
            <div class="deal-store">
              <span class="store-badge">🏪 ${STORE_NAMES[d.storeID]||'Store'}</span>
              <span style="margin-left:8px;font-size:11px;color:var(--text-3)">⭐ ${parseFloat(d.dealRating).toFixed(1)} rating</span>
            </div>
          </div>
        </a>`).join('');
      P.initFadeUp(grid);
    } else {
      grid.style.display = 'none';
      document.getElementById('deals-table-wrap').style.display = 'block';
      if (!allDeals.length) { tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-3)">No deals found.</td></tr>'; return; }
      tbody.innerHTML = allDeals.map(d => `
        <tr onclick="window.open('https://www.cheapshark.com/redirect?dealID=${d.dealID}','_blank','noopener')" style="cursor:pointer">
          <td>
            <div style="display:flex;align-items:center;gap:10px">
              <img class="deal-thumb" src="${d.thumb||P.PLACEHOLDER_WIDE}" alt="${d.title}" loading="lazy" onerror="this.src='${P.PLACEHOLDER_WIDE}'">
              <span style="font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.title}</span>
            </div>
          </td>
          <td><span class="store-badge">🏪 ${STORE_NAMES[d.storeID]||'Store'}</span></td>
          <td style="color:var(--text-3);text-decoration:line-through">$${parseFloat(d.normalPrice).toFixed(2)}</td>
          <td style="color:var(--green);font-weight:700">$${parseFloat(d.salePrice).toFixed(2)}</td>
          <td><span class="badge badge-green">-${Math.round(d.savings)}%</span></td>
          <td style="color:var(--yellow)">⭐ ${parseFloat(d.dealRating).toFixed(1)}</td>
          <td><span class="btn btn-ghost btn-sm">View Deal →</span></td>
        </tr>`).join('');
    }
    renderPagination();
  }

  function renderPagination() {
    const el = document.getElementById('pagination');
    if (!el) return;
    el.innerHTML = `
      <button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===0?'disabled style="opacity:0.4"':''}>‹ Prev</button>
      <span style="font-size:13px;color:var(--text-3);padding:0 12px">Page ${currentPage+1}</span>
      <button class="page-btn" onclick="changePage(${currentPage+1})">Next ›</button>`;
  }

  window.changePage = (p) => { if(p<0)return; currentPage=p; window.scrollTo({top:0,behavior:'smooth'}); loadDeals(); };

  // Toggle view
  document.getElementById('view-grid-btn')?.addEventListener('click', () => {
    isGrid=true;
    document.getElementById('view-grid-btn').classList.add('active');
    document.getElementById('view-list-btn').classList.remove('active');
    renderDeals();
  });
  document.getElementById('view-list-btn')?.addEventListener('click', () => {
    isGrid=false;
    document.getElementById('view-list-btn').classList.add('active');
    document.getElementById('view-grid-btn').classList.remove('active');
    renderDeals();
  });

  // Filter events
  ['sort-filter','savings-filter','price-filter'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => { currentPage=0; loadDeals(); });
  });

  await loadStores();
  loadDeals();
})();
</script>
</body>
</html>
